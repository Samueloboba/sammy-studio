
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="theme-color" content="#070b14">
  <meta name="robots" content="noindex, follow">

  <title>404 — Page Not Found | Sammy Studio</title>

  <link rel="stylesheet" href="styles.css">

  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background: #070b14;
      color: #f5f7ff;
    }

    .error-content {
      max-width: 600px;
    }

    .error-code {
      font-size: clamp(100px, 25vw, 190px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -10px;
      color: #55aaff;
      text-shadow: 0 0 50px rgba(85, 170, 255, 0.25);
      margin: 0 0 20px;
    }

    .error-content h1 {
      font-size: clamp(26px, 6vw, 42px);
      margin-bottom: 16px;
    }

    .error-content p {
      color: #aab4c8;
      line-height: 1.8;
      margin-bottom: 30px;
    }

    .home-button {
      display: inline-block;
      padding: 14px 25px;
      border-radius: 8px;
      background: #55aaff;
      color: #070b14;
      text-decoration: none;
      font-weight: 700;
      transition: transform 0.2s ease,
                  background 0.2s ease;
    }

    .home-button:hover {
      transform: translateY(-3px);
      background: #83c2ff;
    }

    .error-brand {
      margin-top: 45px;
      font-size: 13px;
      letter-spacing: 3px;
      color: #78849b;
    }

    @media (prefers-reduced-motion: reduce) {
      .home-button {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="error-page">
    <div class="error-content">

      <p class="error-code">404</p>

      <h1>Oops! Lost in the creative universe?</h1>

      <p>
        The page you're looking for doesn't exist,
        may have moved, or the link might be incorrect.
        Let's get you back to something creative.
      </p>

      <a class="home-button" href="/">
        Back to Homepage →
      </a>

      <div class="error-brand">
        SAMMY STUDIO · IDEAS INTO DIGITAL REALITY
      </div>

    </div>
  </main>
</body>
</html>
